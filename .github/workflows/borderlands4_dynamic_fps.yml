name: Borderlands 4 Dynamic FPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: borderlands4_dynamic_fps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $sdkArchive = Join-Path $env:RUNNER_TEMP 'oak2-sdk.zip'
          $sdkDirectory = Join-Path $env:RUNNER_TEMP 'oak2-sdk'
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'borderlands4-dynamic-fps'

          Invoke-WebRequest `
            -Uri 'https://github.com/bl-sdk/oak2-mod-manager/releases/download/v0.3/oak2-sdk.zip' `
            -OutFile $sdkArchive
          Expand-Archive -LiteralPath $sdkArchive -DestinationPath $sdkDirectory

          New-Item -ItemType Directory -Force `
            (Join-Path $packageDirectory 'mods'), `
            (Join-Path $packageDirectory 'Plugins') | Out-Null
          Copy-Item `
            'build/Release/borderlands4_dynamic_fps.dll' `
            (Join-Path $packageDirectory 'mods/')
          Copy-Item `
            (Join-Path $sdkDirectory 'OakGame/Binaries/Win64/Plugins/unrealsdk.dll') `
            (Join-Path $packageDirectory 'Plugins/')

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: borderlands4-dynamic-fps-windows-x64
          path: ${{ runner.temp }}/borderlands4-dynamic-fps
          if-no-files-found: error
