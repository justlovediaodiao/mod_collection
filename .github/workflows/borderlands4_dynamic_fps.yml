name: Borderlands 4 Dynamic FPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: borderlands4_dynamic_fps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'borderlands4-dynamic-fps'

          New-Item -ItemType Directory -Force `
            (Join-Path $packageDirectory 'mods') | Out-Null
          Copy-Item `
            'build/Release/borderlands4_dynamic_fps.dll' `
            (Join-Path $packageDirectory 'mods/')

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: borderlands4-dynamic-fps-windows-x64
          path: ${{ runner.temp }}/borderlands4-dynamic-fps
          if-no-files-found: error
